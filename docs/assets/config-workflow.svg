<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc">
  <title id="title">共通設定を適用する流れ</title>
  <desc id="desc">原本を validate で検証し、plan で差分と競合を確認する。Codex を終了し、外部ターミナルで apply を実行する。Codex の再起動後に verify で確認する。</desc>
  <rect width="800" height="360" rx="12" fill="#102431"/>
  <text x="42" y="33" fill="#d2e6e3" font-family="'Yu Gothic', 'Meiryo', sans-serif" font-size="30">原本</text>
  <path d="M76 63v111c0 17 15 23 34 23h13" fill="none" stroke="#669e9c" stroke-width="3"/>
  <circle cx="76" cy="63" r="10" fill="#102431" stroke="#82c8c0" stroke-width="3"/>
  <circle cx="76" cy="123" r="10" fill="#102431" stroke="#82c8c0" stroke-width="3"/>
  <circle cx="76" cy="183" r="10" fill="#102431" stroke="#82c8c0" stroke-width="3"/>
  <path d="M58 230h84v55H58zM85 285v12m-15 0h44" fill="none" stroke="#82c8c0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="42" y="334" fill="#d2e6e3" font-family="'Yu Gothic', 'Meiryo', sans-serif" font-size="30">各端末</text>
  <rect x="210" y="24" width="555" height="139" rx="5" fill="#183440" stroke="#355763"/>
  <rect x="210" y="184" width="555" height="151" rx="5" fill="#1e454b" stroke="#6ca8a1"/>
  <path d="M232 94h510M232 264h510" stroke="#537479"/>
  <text x="230" y="69" fill="#f2f8f7" font-family="Consolas, 'Courier New', monospace" font-size="30" font-weight="700">validate</text>
  <text x="428" y="69" fill="#e0efed" font-family="'Yu Gothic', 'Meiryo', sans-serif" font-size="30">原本を検証</text>
  <text x="230" y="143" fill="#f2f8f7" font-family="Consolas, 'Courier New', monospace" font-size="30" font-weight="700">plan</text>
  <text x="428" y="143" fill="#e0efed" font-family="'Yu Gothic', 'Meiryo', sans-serif" font-size="30">差分と競合を確認</text>
  <text x="230" y="229" fill="#f2f8f7" font-family="Consolas, 'Courier New', monospace" font-size="30" font-weight="700">apply</text>
  <text x="428" y="216" fill="#f3f8f7" font-family="'Yu Gothic', 'Meiryo', sans-serif" font-size="30">Codex 終了後</text>
  <text x="428" y="251" fill="#f3f8f7" font-family="'Yu Gothic', 'Meiryo', sans-serif" font-size="30">外部ターミナルで反映</text>
  <text x="230" y="311" fill="#f2f8f7" font-family="Consolas, 'Courier New', monospace" font-size="30" font-weight="700">verify</text>
  <text x="428" y="311" fill="#f3f8f7" font-family="'Yu Gothic', 'Meiryo', sans-serif" font-size="30">再起動後に確認</text>
</svg>
